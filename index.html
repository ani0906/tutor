<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHEM. ARCHIVE｜國中理化元素與化合物圖鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f0e8;
      --paper-light: #faf8f3;
      --ink: #1a1918;
      --ink-muted: #5c5852;
      --line: #1a1918;
      --line-soft: #d4cec2;
      --forest: #1f3a2e;
      --forest-light: #e3ebe6;
      --terracotta: #8a3324;
      --terracotta-light: #f3e4e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .serif {
      font-family: "Playfair Display", "Noto Serif TC", Georgia, serif;
    }

    /* 刊頭導覽列 */
    header {
      border-bottom: 1.5px solid var(--line);
      background: var(--paper);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .masthead {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .masthead-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-mark {
      display: flex;
      flex-direction: column;
    }

    .brand-sub {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 700;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .student-tag {
      background: transparent;
      border: 1px solid var(--line);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .student-tag:hover {
      background: var(--ink);
      color: var(--paper);
    }

    /* 按鈕系統 */
    .btn {
      border: 1.5px solid var(--line);
      background: var(--paper-light);
      color: var(--ink);
      padding: 10px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .btn-solid {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--paper-light);
    }

    .btn-solid:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper-light);
    }

    /* 主容器 */
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .editorial-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 28px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .editorial-header h2 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    .editorial-meta {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* 首頁八族雜誌目錄網格 */
    .index-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1.5px solid var(--line);
      border-left: 1.5px solid var(--line);
      background: var(--paper-light);
    }

    @media (max-width: 900px) {
      .index-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 520px) {
      .index-grid { grid-template-columns: 1fr; }
    }

    .index-card {
      border-right: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      padding: 24px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 195px;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .index-card:hover {
      background: var(--forest);
      color: var(--paper-light);
    }

    .index-card:hover .index-num,
    .index-card:hover .index-symbols {
      color: #c5d6cc;
    }

    .index-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .index-num {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
    }

    .index-group-title {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .index-group-sub {
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .index-symbols {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--forest);
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
    }

    /* 首頁下方雙欄專題區（過渡金屬 ＆ 常見化合物） */
    .special-grid {
      margin-top: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 720px) {
      .special-grid { grid-template-columns: 1fr; }
    }

    .special-card {
      border: 1.5px solid var(--line);
      padding: 28px 26px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 168px;
      transition: all 0.18s ease;
    }

    .special-card.forest-theme {
      background: var(--paper-light);
      color: var(--ink);
    }

    .special-card.forest-theme:hover {
      background: var(--forest);
      color: var(--paper-light);
    }

    .special-card.terracotta-theme {
      background: var(--terracotta);
      color: var(--paper-light);
    }

    .special-card.terracotta-theme:hover {
      background: var(--ink);
      color: var(--paper-light);
    }

    .special-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      letter-spacing: 0.14em;
      font-weight: 800;
      opacity: 0.85;
    }

    .special-card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 24px;
    }

    .special-card-title {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1.25;
    }

    .special-card-arrow {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* 週期表位置圖 */
    .ptable-frame {
      border: 1.5px solid var(--line);
      background: var(--paper-light);
      padding: 20px;
      margin-bottom: 32px;
      overflow-x: auto;
    }

    .ptable-caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .ptable-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(40px, 1fr));
      gap: 3px;
      min-width: 760px;
    }

    .pt-cell {
      aspect-ratio: 1 / 1.1;
      border: 1px solid var(--line-soft);
      background: var(--paper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a39e93;
      user-select: none;
    }

    .pt-cell.empty {
      border: none;
      background: transparent;
    }

    .pt-cell.same-col {
      background: var(--forest-light);
      border-color: var(--forest);
      color: var(--forest);
    }

    .pt-cell.active-target {
      background: var(--forest);
      border: 1.5px solid var(--ink);
      color: var(--paper-light);
      font-weight: 900;
    }

    .pt-sym {
      font-size: 0.95rem;
      line-height: 1.1;
    }

    .pt-zh {
      font-size: 0.72rem;
      margin-top: 2px;
      line-height: 1;
    }

    /* 學習圖鑑卡片網格 */
    .specimen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      border-top: 1.5px solid var(--line);
      border-left: 1.5px solid var(--line);
      background: var(--paper-light);
    }

    .specimen-card {
      border-right: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: background 0.15s ease;
    }

    .specimen-card.clickable {
      cursor: pointer;
    }

    .specimen-card.clickable:hover {
      background: #f0ece1;
    }

    .specimen-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-muted);
      letter-spacing: 0.1em;
    }

    .reaction-tag {
      border: 1px solid var(--terracotta);
      color: var(--terracotta);
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .specimen-main {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }

    .specimen-symbol {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--forest);
      line-height: 1.1;
    }

    .specimen-zh {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--ink);
      text-align: right;
    }

    .specimen-note {
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
      font-size: 0.92rem;
      color: var(--ink-muted);
      font-weight: 700;
    }

    /* 測驗介面（考卷排版風） */
    .exam-sheet {
      max-width: 720px;
      margin: 0 auto;
      border: 1.5px solid var(--line);
      background: var(--paper-light);
    }

    .exam-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1.5px solid var(--line);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .progress-track {
      height: 5px;
      background: var(--line-soft);
      width: 100%;
    }

    .progress-bar {
      height: 100%;
      background: var(--forest);
      transition: width 0.25s ease;
    }

    .exam-body {
      padding: 36px 28px;
    }

    .exam-mode-tag {
      display: inline-block;
      border: 1px solid var(--line);
      padding: 4px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .exam-question {
      font-size: 3.4rem;
      font-weight: 900;
      text-align: center;
      padding: 32px 16px;
      border: 1.5px solid var(--line);
      background: var(--paper);
      margin-bottom: 28px;
      letter-spacing: 0.03em;
    }

    .exam-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 540px) {
      .exam-options { grid-template-columns: 1fr; }
    }

    .opt-choice {
      border: 1.5px solid var(--line);
      background: var(--paper-light);
      padding: 20px 16px;
      font-size: 1.45rem;
      font-weight: 800;
      font-family: inherit;
      color: var(--ink);
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }

    .opt-choice:hover:not(:disabled) {
      background: var(--ink);
      color: var(--paper-light);
    }

    .opt-choice.is-wrong {
      background: var(--terracotta-light);
      border-color: var(--terracotta);
      color: var(--terracotta);
      text-decoration: line-through;
      opacity: 0.7;
    }

    .opt-choice.is-correct {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--paper-light);
    }

    .exam-hint-line {
      margin-top: 20px;
      padding: 12px 16px;
      border-left: 3px solid var(--terracotta);
      background: var(--terracotta-light);
      color: var(--terracotta);
      font-weight: 800;
      font-size: 0.98rem;
      display: none;
    }

    /* 結算成績單 */
    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      margin: 24px 0;
    }

    .report-cell {
      padding: 20px 12px;
      text-align: center;
      border-right: 1px solid var(--line);
    }

    .report-cell:last-child {
      border-right: none;
    }

    .report-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .report-val {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--forest);
    }

    .sync-box {
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
    }

    .wrong-box {
      border: 1px solid var(--terracotta);
      background: var(--terracotta-light);
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--terracotta);
    }

    /* 彈出視窗（輸入姓名 ＆ 化學反應式檢視） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26, 25, 24, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--paper-light);
      border: 2px solid var(--line);
      max-width: 560px;
      width: 100%;
      padding: 28px 28px;
      box-shadow: 8px 8px 0 var(--ink);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 1.45rem;
      font-weight: 900;
    }

    .modal-close {
      background: transparent;
      border: 1px solid var(--line);
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--ink);
    }

    .modal-close:hover {
      background: var(--ink);
      color: var(--paper-light);
    }

    .name-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: inherit;
      border: 1.5px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      margin: 14px 0 20px;
    }

    .name-input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--forest);
    }

    .reaction-item {
      border: 1px solid var(--line-soft);
      background: var(--paper);
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .reaction-desc {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--terracotta);
      margin-bottom: 6px;
    }

    .reaction-eq {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

<header>
  <div class="masthead" id="nav-bar"></div>
</header>

<main id="app"></main>

<!-- 學生姓名輸入視窗 -->
<div class="modal-backdrop" id="name-modal">
  <div class="modal-panel">
    <div class="modal-header">
      <span class="modal-title">請輸入你的名字</span>
    </div>
    <p style="font-size:0.98rem; color:var(--ink-muted); font-weight:700;">
      輸入你的名字或小名，測驗完成後會自動記錄練習進度給老師。
    </p>
    <input type="text" id="student-name-input" class="name-input" placeholder="例如：小宇、王小明" />
    <div style="display:flex; justify-content:flex-end;">
      <button class="btn btn-solid" onclick="saveStudentName()">確認進入 ↗</button>
    </div>
  </div>
</div>

<!-- 化合物反應式詳情視窗 -->
<div class="modal-backdrop" id="compound-modal" onclick="closeCompoundModal(event)">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <span class="serif" style="font-size:0.8rem; color:var(--ink-muted); letter-spacing:0.14em; font-weight:800;">CHEMICAL REACTIONS</span>
        <div class="modal-title" id="modal-compound-title"></div>
      </div>
      <button class="modal-close" onclick="closeCompoundModal()">✕</button>
    </div>
    <p id="modal-compound-note" style="font-size:0.98rem; font-weight:700; color:var(--ink-muted); margin-bottom:16px;"></p>
    <div id="modal-reactions-list"></div>
  </div>
</div>

<script>
  // ==========================================
  // 【設定區】請將 Google Apps Script 部署網址貼在引號內
  // ==========================================
  const GAS_URL = "";

  // ==========================================
  // 國中必背八族元素題庫（台灣國中理化常用語）
  // ==========================================
  const ELEMENT_GROUPS = [
    {
      id: "1A",
      num: "01",
      title: "第 1A 族",
      subtitle: "鹼金屬",
      items: [
        { symbol: "H", zh: "氫", note: "最輕氣體 · 非金屬", confusable: ["He", "Hg"] },
        { symbol: "Li", zh: "鋰", note: "最輕金屬 · 鋰電池材料", confusable: ["I", "Al"] },
        { symbol: "Na", zh: "鈉", note: "食鹽成分 · 儲存在礦物油中", confusable: ["K", "N", "Ne"] },
        { symbol: "K", zh: "鉀", note: "化學性質比鈉更活潑", confusable: ["Na", "Ca", "P"] }
      ]
    },
    {
      id: "2A",
      num: "02",
      title: "第 2A 族",
      subtitle: "鹼土金屬",
      items: [
        { symbol: "Be", zh: "鈹", note: "讀音：皮", confusable: ["B", "Ba", "Br"] },
        { symbol: "Mg", zh: "鎂", note: "燃燒發出強烈白光", confusable: ["Mn", "Ag", "Hg"] },
        { symbol: "Ca", zh: "鈣", note: "骨骼與大理石成分", confusable: ["C", "K", "Cu"] },
        { symbol: "Ba", zh: "鋇", note: "讀音：貝 · 醫療檢查用", confusable: ["Be", "B", "Br"] }
      ]
    },
    {
      id: "3A",
      num: "03",
      title: "第 3A 族",
      subtitle: "硼族",
      items: [
        { symbol: "B", zh: "硼", note: "讀音：朋 · 類金屬", confusable: ["Be", "Ba", "Br"] },
        { symbol: "Al", zh: "鋁", note: "地殼含量最多的金屬", confusable: ["Ag", "Ar", "Au"] },
        { symbol: "Ga", zh: "鎵", note: "讀音：家 · 熔點低，掌心即融", confusable: ["Ca", "Ge"] }
      ]
    },
    {
      id: "4A",
      num: "04",
      title: "第 4A 族",
      subtitle: "碳族",
      items: [
        { symbol: "C", zh: "碳", note: "鑽石與石墨成分", confusable: ["Ca", "Cl", "Cu"] },
        { symbol: "Si", zh: "矽", note: "讀音：夕 · 半導體晶片材料", confusable: ["S", "Ag", "Sn"] },
        { symbol: "Sn", zh: "錫", note: "讀音：席 · 焊錫與馬口鐵材料", confusable: ["Si", "S", "Zn"] },
        { symbol: "Pb", zh: "鉛", note: "鉛蓄電池電極 · 密度大", confusable: ["P", "Pt", "Be"] }
      ]
    },
    {
      id: "5A",
      num: "05",
      title: "第 5A 族",
      subtitle: "氮族",
      items: [

  // 只把緊接在英文字母或右括號後方的數字轉為下標（保留反應式前方的係數）
  function formatFormula(str) {
    return str.replace(/([A-Za-z\)])(\d+)/g, "$1<sub>$2</sub>");
  }

  // 學生姓名視窗控制
  function openNameModal() {
    const modal = document.getElementById("name-modal");
    const input = document.getElementById("student-name-input");
    input.value = studentName;
    modal.classList.add("open");
    setTimeout(() => input.focus(), 50);
  }

  function saveStudentName() {
    const input = document.getElementById("student-name-input");
    const val = input.value.trim();
    if (!val) {
      input.focus();
      return;
    }
    studentName = val;
    localStorage.setItem("chem_student_name", studentName);
    document.getElementById("name-modal").classList.remove("open");
    renderHome();
  }

  document.getElementById("student-name-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") saveStudentName();
  });

  // 化合物反應式彈窗控制
  function openCompoundModal(index) {
    const item = COMPOUND_CATEGORY.items[index];
    if (!item) return;

    document.getElementById("modal-compound-title").innerHTML =
      `<span class="serif" style="color:var(--forest); margin-right:10px;">${formatFormula(item.symbol)}</span>${item.zh}`;
    document.getElementById("modal-compound-note").textContent = item.note;

    const listEl = document.getElementById("modal-reactions-list");
    if (item.reactions && item.reactions.length > 0) {
      listEl.innerHTML = item.reactions.map(r => `
        <div class="reaction-item">
          <div class="reaction-desc">${r.desc}</div>
          <div class="reaction-eq serif">${formatFormula(r.eq)}</div>
        </div>
      `).join("");
    } else {
      listEl.innerHTML = `<p style="color:var(--ink-muted);">暫無收錄反應式</p>`;
    }

    document.getElementById("compound-modal").classList.add("open");
  }

  function closeCompoundModal(e) {
    if (!e || e.target.id === "compound-modal") {
      document.getElementById("compound-modal").classList.remove("open");
    }
  }

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function getCategoryById(catId) {
    if (catId === "COMPOUNDS") return COMPOUND_CATEGORY;
    if (catId === "TRANSITION") return TRANSITION_CATEGORY;
    return ELEMENT_GROUPS.find(g => g.id === catId);
  }

          </div>
        </div>

        <div class="special-card terracotta-theme" onclick="renderCategory('COMPOUNDS')">
          <div class="special-card-top">
            <span class="serif">NO. 10 / FEATURE</span>
            ${STAR_SVG}
          </div>
          <div class="special-card-bottom">
            <div class="special-card-title">常見化合物</div>
            <span class="special-card-arrow">↗</span>
          </div>
        </div>
      </div>
    `;
  }

  // ==========================================
  // 畫面 2：單一分類圖鑑頁（無發音鈕、化合物可點看反應式）
  // ==========================================
  function renderCategory(catId) {
    const isCompound = catId === "COMPOUNDS";
    const category = getCategoryById(catId);

    const nav = document.getElementById("nav-bar");
    nav.innerHTML = `
      <div class="masthead-left">
        <button class="btn" onclick="renderHome()">← 返回目錄</button>
        <div class="brand-mark">
          <span class="brand-sub serif">SECTION ${category.num}</span>
          <span class="brand-title">${category.title}</span>
        </div>
      </div>
      <button class="btn btn-solid" onclick="startQuiz('${catId}')">開始測驗 ↗</button>
    `;

    let ptableHtml = "";
    if (!isCompound) {
      const targetSymbols = new Set(category.items.map(i => i.symbol));
      let cellsHtml = "";
      for (let r = 1; r <= 6; r++) {
        for (let c = 1; c <= 18; c++) {
          const cell = PTABLE_LAYOUT.find(item => item.r === r && item.c === c);
          if (!cell) {
            cellsHtml += `<div class="pt-cell empty"></div>`;
          } else {
            const isTarget = targetSymbols.has(cell.sym);
            const isSameCol = cell.g === catId || cell.g === `${catId}_ext`;
            let cls = "pt-cell";
            if (isTarget) cls += " active-target";
            else if (isSameCol) cls += " same-col";

            cellsHtml += `
              <div class="${cls}">
                <span class="pt-sym serif">${cell.sym}</span>
                ${isTarget ? `<span class="pt-zh">${cell.zh}</span>` : ""}
              </div>
            `;
          }
        }
      }

      ptableHtml = `
        <div class="ptable-frame">
          <div class="ptable-caption">
            <span>週期表位置定位 — ${category.title}</span>
            <span class="serif">PERIODIC TABLE LOCATION</span>
          </div>
          <div class="ptable-grid">${cellsHtml}</div>
        </div>
      `;
    }

    const cardsHtml = category.items.map((item, index) => {
      const clickAttr = isCompound ? `onclick="openCompoundModal(${index})"` : "";
      const clickCls = isCompound ? "clickable" : "";
      const rightTag = isCompound ? `<span class="reaction-tag">反應式 ↗</span>` : "";

      return `
        <div class="specimen-card ${clickCls}" ${clickAttr}>
          <div class="specimen-top">
            <span class="serif">FIG. ${String(index + 1).padStart(2, "0")}</span>
            ${rightTag}
          </div>
          <div class="specimen-main">
            <div class="specimen-symbol serif">${formatFormula(item.symbol)}</div>
            <div class="specimen-zh">${item.zh}</div>
          </div>
          <div class="specimen-note">${item.note}</div>
        </div>
      `;
    }).join("");

    const headerSub = isCompound
      ? `<span class="editorial-meta">點擊任一卡片可檢視相關化學反應式</span>`
      : `<span class="editorial-meta serif">TOTAL ${category.items.length} ITEMS</span>`;

    document.getElementById("app").innerHTML = `
      ${ptableHtml}
      <div class="editorial-header">
        <h2>${category.title}（${category.subtitle}）</h2>
        ${headerSub}
      </div>
      <div class="specimen-grid">${cardsHtml}</div>
    `;
  }

  // ==========================================
  // 畫面 3：隨機雙向測驗引擎
  // ==========================================
  function startQuiz(catId) {
    if (!studentName) {
      openNameModal();
      return;
    }

    let pool = [];
    let categoryTitle = "";

    const allElements = [
      ...ELEMENT_GROUPS.flatMap(g => g.items),
      ...TRANSITION_CATEGORY.items
    ];
    const allCompounds = COMPOUND_CATEGORY.items;

    if (catId === "ALL") {
      categoryTitle = "全部混考";
      pool = shuffle([...allElements, ...allCompounds]).slice(0, 15);
    } else if (catId === "COMPOUNDS") {
      categoryTitle = COMPOUND_CATEGORY.title;
      pool = shuffle(allCompounds);
    } else if (catId === "TRANSITION") {
      categoryTitle = TRANSITION_CATEGORY.title;
      pool = shuffle(TRANSITION_CATEGORY.items);
    } else {
      const grp = ELEMENT_GROUPS.find(g => g.id === catId);
      categoryTitle = `${grp.title}（${grp.subtitle}）`;
      pool = grp.items.length < 4
        ? shuffle([...grp.items, ...grp.items])
        : shuffle(grp.items);
    }

    const questions = pool.map(target => {
      const isCompoundItem = allCompounds.some(c => c.symbol === target.symbol);
      const distractorSource = isCompoundItem ? allCompounds : allElements;
      const mode = Math.random() < 0.5 ? "SYM_TO_ZH" : "ZH_TO_SYM";

      let distractors = [];
      if (target.confusable) {
        target.confusable.forEach(sym => {
          const found = distractorSource.find(x => x.symbol === sym && x.symbol !== target.symbol);
          if (found && distractors.length < 3) distractors.push(found);
        });
      }
      const remaining = shuffle(
        distractorSource.filter(x => x.symbol !== target.symbol && !distractors.some(d => d.symbol === x.symbol))
      );
      while (distractors.length < 3 && remaining.length > 0) {
        distractors.push(remaining.pop());
      }

      return {
        target,
        mode,
        options: shuffle([target, ...distractors]),
        answeredWrongOnce: false
      };
    });

    quizState = {
      catId,
      categoryTitle,
      questions,
      currentIndex: 0,
      firstTryCorrect: 0,
      wrongSet: new Set(),
      startTime: Date.now()
    };

    renderQuestion();
  }

  function renderQuestion() {
    const q = quizState.questions[quizState.currentIndex];
    const total = quizState.questions.length;
    const progressPct = Math.round((quizState.currentIndex / total) * 100);

    const nav = document.getElementById("nav-bar");
    nav.innerHTML = `
      <div class="masthead-left">
        <button class="btn" onclick="exitQuiz()">✕ 結束測驗</button>
        <div class="brand-mark">
          <span class="brand-sub serif">EXAMINATION MODE</span>
          <span class="brand-title">${quizState.categoryTitle}</span>
        </div>
      </div>
      <span class="serif" style="font-weight:800; font-size:1.05rem;">${quizState.currentIndex + 1} / ${total}</span>
    `;

    const isSymToZh = q.mode === "SYM_TO_ZH";
    const modeLabel = isSymToZh ? "題型：看符號選中文" : "題型：看中文選符號";
    const promptHtml = isSymToZh ? formatFormula(q.target.symbol) : q.target.zh;

    const optionsHtml = q.options.map((opt, idx) => {
      const label = isSymToZh ? opt.zh : formatFormula(opt.symbol);
      const fontCls = isSymToZh ? "" : "serif";
      return `<button class="opt-choice ${fontCls}" id="opt-${idx}" onclick="checkAnswer(${idx})">${label}</button>`;
    }).join("");

    document.getElementById("app").innerHTML = `
      <div class="exam-sheet">
        <div class="exam-topbar">
          <span>${quizState.categoryTitle}</span>
          <span class="serif">QUESTION ${String(quizState.currentIndex + 1).padStart(2, "0")} OF ${String(total).padStart(2, "0")}</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" style="width:${progressPct}%"></div>
        </div>

        <div class="exam-body">
          <span class="exam-mode-tag">${modeLabel}</span>
          <div class="exam-question ${isSymToZh ? "serif" : ""}">${promptHtml}</div>
          <div class="exam-options">${optionsHtml}</div>
          <div id="feedback" class="exam-hint-line"></div>
        </div>
      </div>
    `;
  }

  function checkAnswer(selectedIndex) {
    const q = quizState.questions[quizState.currentIndex];
    const chosen = q.options[selectedIndex];
    const btn = document.getElementById(`opt-${selectedIndex}`);
    const feedback = document.getElementById("feedback");

    if (chosen.symbol === q.target.symbol) {
      btn.classList.add("is-correct");
      document.querySelectorAll(".opt-choice").forEach(b => b.disabled = true);

      if (!q.answeredWrongOnce) {
        quizState.firstTryCorrect++;
      }

      setTimeout(() => {
        quizState.currentIndex++;
        if (quizState.currentIndex < quizState.questions.length) {
          renderQuestion();
        } else {
          finishQuiz();
        }
      }, 650);
    } else {
      btn.classList.add("is-wrong");
      btn.disabled = true;
      q.answeredWrongOnce = true;
      quizState.wrongSet.add(`${q.target.symbol}(${q.target.zh})`);

      feedback.style.display = "block";
      feedback.textContent = `提示：${q.target.note}`;
    }
  }

  function exitQuiz() {
    if (confirm("確定要中斷測驗返回嗎？")) {
      if (quizState.catId === "ALL") renderHome();
      else renderCategory(quizState.catId);
    }
  }

  // ==========================================
  // 畫面 4：結算成績單 ＋ 同步後台
  // ==========================================
  function finishQuiz() {
    const total = quizState.questions.length;
    const score = quizState.firstTryCorrect;
    const accuracy = Math.round((score / total) * 100);
    const durationSec = Math.round((Date.now() - quizState.startTime) / 1000);
    const wrongList = Array.from(quizState.wrongSet);

    const nav = document.getElementById("nav-bar");
    nav.innerHTML = `
      <div class="masthead-left">
        <button class="btn" onclick="renderHome()">← 返回目錄</button>
        <div class="brand-mark">
          <span class="brand-sub serif">EXAM REPORT</span>
          <span class="brand-title">測驗紀錄結算</span>
        </div>
      </div>
    `;

    const wrongHtml = wrongList.length > 0
      ? `<div class="wrong-box">需再複習項目：${wrongList.join("、")}</div>`
      : "";

    document.getElementById("app").innerHTML = `
      <div class="exam-sheet">
        <div class="exam-topbar">
          <span>${quizState.categoryTitle}（${studentName}）</span>
          <span class="serif">COMPLETED</span>
        </div>
        <div class="exam-body">
          <div class="report-grid">
            <div class="report-cell">
              <div class="report-label">一次答對</div>
              <div class="report-val serif">${score} / ${total}</div>
            </div>
            <div class="report-cell">
              <div class="report-label">一次正確率</div>
              <div class="report-val serif">${accuracy}%</div>
            </div>
            <div class="report-cell">
              <div class="report-label">作答秒數</div>
              <div class="report-val serif">${durationSec}s</div>
            </div>
          </div>

          <div id="sync-status" class="sync-box">正在同步成績紀錄...</div>

          ${wrongHtml}

          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button class="btn btn-solid" onclick="startQuiz('${quizState.catId}')">重新測驗</button>
            <button class="btn" onclick="renderHome()">返回目錄</button>
          </div>
        </div>
      </div>
    `;

    sendRecordToTeacher({
      studentName,
      category: quizState.categoryTitle,
      firstTryScore: score,
      totalQuestions: total,
      accuracy: `${accuracy}%`,
      wrongItems: wrongList.length > 0 ? wrongList.join("、") : "全對！",
      durationSec
    });
  }

  function sendRecordToTeacher(payload) {
    const statusEl = document.getElementById("sync-status");
    if (!GAS_URL) {
      statusEl.textContent = "單機練習模式（尚未填入試算表後台網址）";
      return;
    }

    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          statusEl.style.background = "var(--forest-light)";
          statusEl.style.borderColor = "var(--forest)";
          statusEl.style.color = "var(--forest)";
          statusEl.textContent = "作答紀錄已同步至試算表後台";
        } else {
          throw new Error(data.message);
        }
      })
      .catch(() => {
        statusEl.style.background = "var(--terracotta-light)";
        statusEl.style.borderColor = "var(--terracotta)";
        statusEl.style.color = "var(--terracotta)";
        statusEl.textContent = "紀錄傳送失敗，請直接截圖此畫面";
      });
  }

  // 初始化畫面，若尚未輸入名字則自動跳出輸入視窗
  renderHome();
  if (!studentName) {
    openNameModal();
  }
</script>
