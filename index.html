<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHEM. ARCHIVE｜國中理化元素與化合物圖鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f0e8;
      --paper-light: #faf8f3;
      --ink: #1a1918;
      --ink-muted: #5c5852;
      --line: #1a1918;
      --line-soft: #d4cec2;
      --forest: #1f3a2e;
      --forest-light: #e3ebe6;
      --terracotta: #8a3324;
      --terracotta-light: #f3e4e1;
      --ochre: #8c6d2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .serif {
      font-family: "Playfair Display", "Noto Serif TC", Georgia, serif;
    }

    /* 刊頭導覽列 */
    header {
      border-bottom: 1.5px solid var(--line);
      background: var(--paper);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .masthead {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .masthead-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-mark {
      display: flex;
      flex-direction: column;
    }

    .brand-sub {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 700;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .student-tag {
      background: transparent;
      border: 1px solid var(--line);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .student-tag:hover {
      background: var(--ink);
      color: var(--paper);
    }

    /* 按鈕系統 */
    .btn {
      border: 1.5px solid var(--line);
      background: var(--paper-light);
      color: var(--ink);
      padding: 10px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .btn-solid {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--paper-light);
    }

    .btn-solid:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper-light);
    }

    .btn-terracotta {
      background: var(--terracotta);
      border-color: var(--terracotta);
      color: var(--paper-light);
    }

    .btn-terracotta:hover {
      background: var(--ink);
      border-color: var(--ink);
    }

    /* 主容器 */
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .editorial-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 28px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .editorial-header h2 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    .editorial-meta {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* 首頁雜誌目錄網格 */
    .index-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1.5px solid var(--line);
      border-left: 1.5px solid var(--line);
      background: var(--paper-light);
    }

    @media (max-width: 900px) {
      .index-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 520px) {
      .index-grid { grid-template-columns: 1fr; }
    }

    .index-card {
      border-right: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      padding: 24px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 195px;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .index-card:hover {
      background: var(--forest);
      color: var(--paper-light);
    }

    .index-card:hover .index-num,
    .index-card:hover .index-symbols {
      color: #c5d6cc;
    }

    .index-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .index-num {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
    }

    .index-group-title {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .index-group-sub {
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .index-symbols {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--forest);
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
    }

    /* 常見化合物獨立專欄區塊 */
    .feature-spread {
      margin-top: 32px;
      border: 1.5px solid var(--line);
      background: var(--paper-light);
      display: grid;
      grid-template-columns: 280px 1fr;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    @media (max-width: 720px) {
      .feature-spread { grid-template-columns: 1fr; }
    }

    .feature-spread:hover {
      background: var(--terracotta);
      color: var(--paper-light);
    }

    .feature-spread:hover .feature-list {
      color: var(--paper-light);
    }

    .feature-badge-col {
      background: var(--terracotta);
      color: var(--paper-light);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1.5px solid var(--line);
    }

    @media (max-width: 720px) {
      .feature-badge-col {
        border-right: none;
        border-bottom: 1.5px solid var(--line);
      }
    }

    .feature-content-col {
      padding: 28px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .feature-list {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.8;
    }

    /* 週期表位置圖（建築線框風） */
    .ptable-frame {
      border: 1.5px solid var(--line);
      background: var(--paper-light);
      padding: 20px;
      margin-bottom: 32px;
      overflow-x: auto;
    }

    .ptable-caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .ptable-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(40px, 1fr));
      gap: 3px;
      min-width: 760px;
    }

    .pt-cell {
      aspect-ratio: 1 / 1.1;
      border: 1px solid var(--line-soft);
      background: var(--paper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a39e93;
      user-select: none;
    }

    .pt-cell.empty {
      border: none;
      background: transparent;
    }

    .pt-cell.same-col {
      background: var(--forest-light);
      border-color: var(--forest);
      color: var(--forest);
    }

    .pt-cell.active-target {
      background: var(--forest);
      border: 1.5px solid var(--ink);
      color: var(--paper-light);
      font-weight: 900;
    }

    .pt-sym {
      font-size: 0.95rem;
      line-height: 1.1;
    }

    .pt-zh {
      font-size: 0.72rem;
      margin-top: 2px;
      line-height: 1;
    }

    /* 學習圖鑑卡片網格 */
    .specimen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      border-top: 1.5px solid var(--line);
      border-left: 1.5px solid var(--line);
      background: var(--paper-light);
    }

    .specimen-card {
      border-right: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .specimen-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-muted);
      letter-spacing: 0.1em;
    }

    .audio-btn {
      background: transparent;
      border: 1px solid var(--line);
      padding: 3px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .audio-btn:hover {
      background: var(--ink);
      color: var(--paper-light);
    }

    .specimen-main {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }

    .specimen-symbol {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--forest);
      line-height: 1.1;
    }

    .specimen-zh {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--ink);
      text-align: right;
    }

    .specimen-note {
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
      font-size: 0.92rem;
      color: var(--ink-muted);
      font-weight: 700;
    }

    /* 測驗介面（考卷排版風） */
    .exam-sheet {
      max-width: 720px;
      margin: 0 auto;
      border: 1.5px solid var(--line);
      background: var(--paper-light);
    }

    .exam-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1.5px solid var(--line);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .progress-track {
      height: 5px;
      background: var(--line-soft);
      width: 100%;
    }

    .progress-bar {
      height: 100%;
      background: var(--forest);
      transition: width 0.25s ease;
    }

    .exam-body {
      padding: 36px 28px;
    }

    .exam-mode-tag {
      display: inline-block;
      border: 1px solid var(--line);
      padding: 4px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .exam-question {
      font-size: 3.4rem;
      font-weight: 900;
      text-align: center;
      padding: 32px 16px;
      border: 1.5px solid var(--line);
      background: var(--paper);
      margin-bottom: 28px;
      letter-spacing: 0.03em;
    }

    .exam-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 540px) {
      .exam-options { grid-template-columns: 1fr; }
    }

    .opt-choice {
      border: 1.5px solid var(--line);
      background: var(--paper-light);
      padding: 20px 16px;
      font-size: 1.45rem;
      font-weight: 800;
      font-family: inherit;
      color: var(--ink);
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }

    .opt-choice:hover:not(:disabled) {
      background: var(--ink);
      color: var(--paper-light);
    }

    .opt-choice.is-wrong {
      background: var(--terracotta-light);
      border-color: var(--terracotta);
      color: var(--terracotta);
      text-decoration: line-through;
      opacity: 0.7;
    }

    .opt-choice.is-correct {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--paper-light);
    }

    .exam-hint-line {
      margin-top: 20px;
      padding: 12px 16px;
      border-left: 3px solid var(--terracotta);
      background: var(--terracotta-light);
      color: var(--terracotta);
      font-weight: 800;
      font-size: 0.98rem;
      display: none;
    }

    /* 結算成績單 */
    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      margin: 24px 0;
    }

    .report-cell {
      padding: 20px 12px;
      text-align: center;
      border-right: 1px solid var(--line);
    }

    .report-cell:last-child {
      border-right: none;
    }

    .report-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .report-val {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--forest);
    }

    .sync-box {
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
    }

    .wrong-box {
      border: 1px solid var(--terracotta);
      background: var(--terracotta-light);
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--terracotta);
    }
  </style>
</head>

    { r: 6, c: 18, sym: "Rn", zh: "氡", g: "8A_ext" }
  ];

  // 幾何星號 SVG（雜誌排版點綴）
  const STAR_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/></svg>`;
  const SPEAKER_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;

  let studentName = localStorage.getItem("chem_student_name") || DEFAULT_STUDENT_NAME;
  let quizState = null;

  function formatFormula(str) {
    return str.replace(/(\d+)/g, "<sub>$1</sub>");
  }

  function speakText(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-TW";
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }

  function changeStudentName() {
    const input = prompt("輸入學生代號或小名：", studentName);
    if (input && input.trim()) {
      studentName = input.trim();
      localStorage.setItem("chem_student_name", studentName);
      renderHome();
    }
  }

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // ==========================================
  // 畫面 1：首頁目錄（八族 + 常見化合物 + 右上角全部混考）
  // ==========================================
  function renderHome() {
    const nav = document.getElementById("nav-bar");
    nav.innerHTML = `
      <div class="masthead-left">
        <div class="brand-mark">
          <span class="brand-sub serif">CHEM. ARCHIVE / VOL. 01</span>
          <span class="brand-title">國中理化元素圖鑑</span>
        </div>
        <button class="student-tag" onclick="changeStudentName()">代號：${studentName}</button>
      </div>
      <button class="btn btn-solid" onclick="startQuiz('ALL')">全部混考 ↗</button>
    `;

    const groupGridHtml = ELEMENT_GROUPS.map(g => {
      const syms = g.items.map(i => i.symbol).join(" · ");
      return `
        <div class="index-card" onclick="renderCategory('${g.id}')">
          <div>
            <div class="index-top">
              <span class="index-num serif">NO. ${g.num}</span>
              <span>${STAR_SVG}</span>
            </div>
            <div class="index-group-title">${g.title}</div>
            <div class="index-group-sub">${g.subtitle}</div>
          </div>
          <div class="index-symbols serif">${syms}</div>
        </div>
      `;
    }).join("");

    const compoundPreview = COMPOUND_CATEGORY.items
      .map(i => `${formatFormula(i.symbol)} ${i.zh}`)
      .join(" / ");

    document.getElementById("app").innerHTML = `
      <div class="editorial-header">
        <h2>八族元素分類目錄</h2>
        <span class="editorial-meta serif">8 MAIN GROUPS · PERIODIC TABLE</span>
      </div>

      <div class="index-grid">
        ${groupGridHtml}
      </div>

      <div class="feature-spread" onclick="renderCategory('COMPOUNDS')">
        <div class="feature-badge-col">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="serif" style="font-size:0.9rem; letter-spacing:0.14em; font-weight:800;">NO. 09 / FEATURE</span>
            ${STAR_SVG}
          </div>
          <div>
            <div style="font-size:1.75rem; font-weight:900; margin-top:16px;">常見化合物</div>
            <div style="font-size:0.95rem; opacity:0.85; margin-top:4px;">共 ${COMPOUND_CATEGORY.items.length} 組國中必背化學式</div>
          </div>
        </div>
        <div class="feature-content-col">
          <div class="feature-list">${compoundPreview}</div>
        </div>
      </div>
    `;
  }

  // ==========================================
  // 畫面 2：單一分類圖鑑頁（週期表位置圖 + 極簡圖鑑卡 + 右上角開始測驗）
  // ==========================================
  function renderCategory(catId) {
    const isCompound = catId === "COMPOUNDS";
    const category = isCompound ? COMPOUND_CATEGORY : ELEMENT_GROUPS.find(g => g.id === catId);

    const nav = document.getElementById("nav-bar");
    nav.innerHTML = `
      <div class="masthead-left">
        <button class="btn" onclick="renderHome()">← 返回目錄</button>
        <div class="brand-mark">
          <span class="brand-sub serif">SECTION ${category.num}</span>
          <span class="brand-title">${category.title}・${category.subtitle}</span>
        </div>
      </div>
      <button class="btn btn-solid" onclick="startQuiz('${catId}')">開始測驗 ↗</button>
    `;

    let ptableHtml = "";
    if (!isCompound) {
      const targetSymbols = new Set(category.items.map(i => i.symbol));
      let cellsHtml = "";
      for (let r = 1; r <= 6; r++) {
        for (let c = 1; c <= 18; c++) {
          const cell = PTABLE_LAYOUT.find(item => item.r === r && item.c === c);
          if (!cell) {
            cellsHtml += `<div class="pt-cell empty"></div>`;
          } else {
            const isTarget = targetSymbols.has(cell.sym);
            const isSameCol = cell.g === catId || cell.g === `${catId}_ext`;
            let cls = "pt-cell";
            if (isTarget) cls += " active-target";
            else if (isSameCol) cls += " same-col";

            cellsHtml += `
              <div class="${cls}">
                <span class="pt-sym serif">${cell.sym}</span>
                ${isTarget ? `<span class="pt-zh">${cell.zh}</span>` : ""}
              </div>
            `;
          }
        }
      }

      ptableHtml = `
        <div class="ptable-frame">
          <div class="ptable-caption">
            <span>週期表位置定位 — ${category.title}</span>
            <span class="serif">PERIODIC TABLE LOCATION</span>
          </div>
          <div class="ptable-grid">${cellsHtml}</div>
        </div>
      `;
    }

    const cardsHtml = category.items.map((item, index) => `
      <div class="specimen-card">
        <div class="specimen-top">
          <span class="serif">FIG. ${String(index + 1).padStart(2, "0")}</span>
          <button class="audio-btn" onclick="speakText('${item.zh}')">${SPEAKER_SVG} 發音</button>
        </div>
        <div class="specimen-main">
          <div class="specimen-symbol serif">${formatFormula(item.symbol)}</div>
          <div class="specimen-zh">${item.zh}</div>
        </div>
        <div class="specimen-note">${item.note}</div>
      </div>
    `).join("");

    document.getElementById("app").innerHTML = `
      ${ptableHtml}
      <div class="editorial-header">
        <h2>${category.title}（${category.subtitle}）</h2>
        <span class="editorial-meta serif">TOTAL ${category.items.length} ITEMS</span>
      </div>
      <div class="specimen-grid">${cardsHtml}</div>
    `;
  }

  // ==========================================
  // 畫面 3：隨機雙向測驗引擎
  // ==========================================
  function startQuiz(catId) {
    let pool = [];
    let categoryTitle = "";

    const allElements = ELEMENT_GROUPS.flatMap(g => g.items);
    const allCompounds = COMPOUND_CATEGORY.items;

    if (catId === "ALL") {
      categoryTitle = "全部混考";
      pool = shuffle([...allElements, ...allCompounds]).slice(0, 12);
    } else if (catId === "COMPOUNDS") {
      categoryTitle = COMPOUND_CATEGORY.title;
      pool = shuffle(allCompounds);
    } else {
      const grp = ELEMENT_GROUPS.find(g => g.id === catId);
      categoryTitle = `${grp.title}（${grp.subtitle}）`;
      pool = grp.items.length < 4
        ? shuffle([...grp.items, ...grp.items])
        : shuffle(grp.items);
    }

    const questions = pool.map(target => {
      const isCompoundItem = allCompounds.some(c => c.symbol === target.symbol);
      const distractorSource = isCompoundItem ? allCompounds : allElements;
      const mode = Math.random() < 0.5 ? "SYM_TO_ZH" : "ZH_TO_SYM";

      let distractors = [];
      if (target.confusable) {
        target.confusable.forEach(sym => {
          const found = distractorSource.find(x => x.symbol === sym && x.symbol !== target.symbol);
          if (found && distractors.length < 3) distractors.push(found);
        });
      }
      const remaining = shuffle(
        distractorSource.filter(x => x.symbol !== target.symbol && !distractors.some(d => d.symbol === x.symbol))
      );
      while (distractors.length < 3 && remaining.length > 0) {
        distractors.push(remaining.pop());
      }

      return {
        target,
        mode,
        options: shuffle([target, ...distractors]),
        answeredWrongOnce: false
      };
    });

    quizState = {
      catId,
      categoryTitle,
      questions,
      currentIndex: 0,
      firstTryCorrect: 0,
      wrongSet: new Set(),
      startTime: Date.now()
    };

    renderQuestion();
  }

  function renderQuestion() {
    const q = quizState.questions[quizState.currentIndex];
    const total = quizState.questions.length;
    const progressPct = Math.round((quizState.currentIndex / total) * 100);

    const nav = document.getElementById("nav-bar");
    nav.innerHTML = `
      <div class="masthead-left">
        <button class="btn" onclick="exitQuiz()">✕ 結束測驗</button>
        <div class="brand-mark">
          <span class="brand-sub serif">EXAMINATION MODE</span>
          <span class="brand-title">${quizState.categoryTitle}</span>
        </div>
      </div>
      <span class="serif" style="font-weight:800; font-size:1.05rem;">${quizState.currentIndex + 1} / ${total}</span>
    `;

    const isSymToZh = q.mode === "SYM_TO_ZH";
    const modeLabel = isSymToZh ? "題型：看符號選中文" : "題型：看中文選符號";
    const promptHtml = isSymToZh ? formatFormula(q.target.symbol) : q.target.zh;

    const optionsHtml = q.options.map((opt, idx) => {
      const label = isSymToZh ? opt.zh : formatFormula(opt.symbol);
      const fontCls = isSymToZh ? "" : "serif";
      return `<button class="opt-choice ${fontCls}" id="opt-${idx}" onclick="checkAnswer(${idx})">${label}</button>`;
    }).join("");

    document.getElementById("app").innerHTML = `
      <div class="exam-sheet">
        <div class="exam-topbar">
          <span>${quizState.categoryTitle}</span>
          <span class="serif">QUESTION ${String(quizState.currentIndex + 1).padStart(2, "0")} OF ${String(total).padStart(2, "0")}</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" style="width:${progressPct}%"></div>
        </div>

        <div class="exam-body">
          <span class="exam-mode-tag">${modeLabel}</span>
          <div class="exam-question ${isSymToZh ? "serif" : ""}">${promptHtml}</div>
          <div class="exam-options">${optionsHtml}</div>
          <div id="feedback" class="exam-hint-line"></div>
        </div>
      </div>
    `;
  }

  function checkAnswer(selectedIndex) {
    const q = quizState.questions[quizState.currentIndex];
    const chosen = q.options[selectedIndex];
    const btn = document.getElementById(`opt-${selectedIndex}`);
    const feedback = document.getElementById("feedback");

    if (chosen.symbol === q.target.symbol) {
      btn.classList.add("is-correct");
      document.querySelectorAll(".opt-choice").forEach(b => b.disabled = true);

      if (!q.answeredWrongOnce) {
        quizState.firstTryCorrect++;
      }

      speakText(q.target.zh);

      setTimeout(() => {
        quizState.currentIndex++;
        if (quizState.currentIndex < quizState.questions.length) {
          renderQuestion();
        } else {
          finishQuiz();
        }
      }, 750);
    } else {
      btn.classList.add("is-wrong");
      btn.disabled = true;
      q.answeredWrongOnce = true;
      quizState.wrongSet.add(`${q.target.symbol}(${q.target.zh})`);

      feedback.style.display = "block";
      feedback.textContent = `提示：${q.target.note}`;
    }
  }

  function exitQuiz() {
    if (confirm("確定要中斷測驗返回嗎？")) {
      if (quizState.catId === "ALL") renderHome();
      else renderCategory(quizState.catId);
    }
  }

  // ==========================================
  // 畫面 4：結算成績單 ＋ 同步後台
  // ==========================================
  function finishQuiz() {
    const total = quizState.questions.length;
    const score = quizState.firstTryCorrect;
    const accuracy = Math.round((score / total) * 100);
    const durationSec = Math.round((Date.now() - quizState.startTime) / 1000);
    const wrongList = Array.from(quizState.wrongSet);

    const nav = document.getElementById("nav-bar");
    nav.innerHTML = `
      <div class="masthead-left">
        <button class="btn" onclick="renderHome()">← 返回目錄</button>
        <div class="brand-mark">
          <span class="brand-sub serif">EXAM REPORT</span>
          <span class="brand-title">測驗紀錄結算</span>
        </div>
      </div>
    `;

    const wrongHtml = wrongList.length > 0
      ? `<div class="wrong-box">需再複習項目：${wrongList.join("、")}</div>`
      : "";

    document.getElementById("app").innerHTML = `
      <div class="exam-sheet">
        <div class="exam-topbar">
          <span>${quizState.categoryTitle}</span>
          <span class="serif">COMPLETED</span>
        </div>
        <div class="exam-body">
          <div class="report-grid">
            <div class="report-cell">
              <div class="report-label">一次答對</div>
              <div class="report-val serif">${score} / ${total}</div>
            </div>
            <div class="report-cell">
              <div class="report-label">一次正確率</div>
              <div class="report-val serif">${accuracy}%</div>
            </div>
            <div class="report-cell">
              <div class="report-label">作答秒數</div>
              <div class="report-val serif">${durationSec}s</div>
            </div>
          </div>

          <div id="sync-status" class="sync-box">正在同步成績紀錄...</div>

          ${wrongHtml}

          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button class="btn btn-solid" onclick="startQuiz('${quizState.catId}')">重新測驗</button>
            <button class="btn" onclick="renderHome()">返回目錄</button>
          </div>
        </div>
      </div>
    `;

    sendRecordToTeacher({
      studentName,
      category: quizState.categoryTitle,
      firstTryScore: score,
      totalQuestions: total,
      accuracy: `${accuracy}%`,
      wrongItems: wrongList.length > 0 ? wrongList.join("、") : "全對！",
      durationSec
    });
  }

  function sendRecordToTeacher(payload) {
    const statusEl = document.getElementById("sync-status");
    if (!GAS_URL) {
      statusEl.textContent = "單機練習模式（尚未填入後台）";
      return;
    }

    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          statusEl.style.background = "var(--forest-light)";
          statusEl.style.borderColor = "var(--forest)";
          statusEl.style.color = "var(--forest)";
          statusEl.textContent = "作答紀錄已同步至後台";
        } else {
          throw new Error(data.message);
        }
      })
      .catch(() => {
        statusEl.style.background = "var(--terracotta-light)";
        statusEl.style.borderColor = "var(--terracotta)";
        statusEl.style.color = "var(--terracotta)";
        statusEl.textContent = "紀錄傳送失敗，請直接截圖此畫面";
      });
  }

  renderHome();
</script>
